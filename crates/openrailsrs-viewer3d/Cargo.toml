[package]
name = "openrailsrs-viewer3d"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Experimental 3D viewer (Bevy) — track graph from track.toml + free camera"
default-run = "openrailsrs-viewer3d"

[lib]
path = "src/lib.rs"

[[bin]]
name = "openrailsrs-viewer3d"
path = "src/main.rs"

[[bin]]
name = "openrailsrs-visual-diff"
path = "src/bin/visual_diff.rs"

[[bin]]
name = "openrailsrs-prepare-content"
path = "src/bin/prepare_content.rs"

[features]
default = []
trace = ["bevy/trace"]
dev-tools = ["bevy/bevy_dev_tools", "bevy/mesh_picking"]
dev-inspector = ["dep:bevy-inspector-egui", "bevy/mesh_picking"]
experimental-framepace = ["dep:bevy_framepace"]

[dependencies]
openrailsrs-core = { path = "../openrailsrs-core" }
openrailsrs-campaign = { path = "../openrailsrs-campaign" }
openrailsrs-content = { path = "../openrailsrs-content" }
openrailsrs-msts = { path = "../openrailsrs-msts" }
openrailsrs-bevy-scenery = { path = "../openrailsrs-bevy-scenery" }
openrailsrs-or-shader = { path = "../openrailsrs-or-shader" }
openrailsrs-ace = { path = "../openrailsrs-ace" }
openrailsrs-formats = { path = "../openrailsrs-formats" }
openrailsrs-route = { path = "../openrailsrs-route" }
openrailsrs-scenarios = { path = "../openrailsrs-scenarios" }
openrailsrs-track = { path = "../openrailsrs-track" }
openrailsrs-train = { path = "../openrailsrs-train" }
openrailsrs-sim = { path = "../openrailsrs-sim" }
openrailsrs-audio = { path = "../openrailsrs-audio" }
csv = "1.3"
sha2 = "0.10"
zstd = "0.13"
rayon.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
bevy = { workspace = true, features = ["bevy_gizmos", "bevy_ui_render", "bevy_state"] }
bevy_clipboard = { version = "0.19.1", features = ["system_clipboard"] }
bevy_hanabi = { version = "=0.19.0", default-features = false, features = ["3d"] }
bevy-inspector-egui = { version = "0.37", optional = true, default-features = false, features = ["bevy_pbr", "bevy_render"] }
bevy_framepace = { version = "0.22", optional = true, default-features = false }
bytemuck.workspace = true
image = { workspace = true, features = ["png", "bmp"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.189"
mimalloc3 = { version = "=0.1.56", default-features = false, features = ["no_thp"] }
# Pin the sys package too, preserving the verified Microsoft 3.5.3 native source.
libmimalloc-sys3 = { version = "=0.1.53", default-features = false }

[dev-dependencies]
openrailsrs-core = { path = "../openrailsrs-core" }
tempfile = "3"

[build-dependencies]
sha2 = "0.10.9"
