[scenario]
name = "Vapor: fogonero y ténder finito"
description = "Prueba sintética de 1 km. B abre fogonero, corte, inyectores, tiro, soplador y purgas. Paradas de 5 segundos."

[route]
path = "route"
start = "a"
destination = "b"
assume_signals_clear = true

[[route.stops]]
node = "a"
arrive_s = 0.0
depart_s = 5.0
dwell_s = 5.0

[[route.stops]]
node = "mid"
arrive_s = 90.0
depart_s = 95.0
dwell_s = 5.0

[[route.stops]]
node = "b"
arrive_s = 160.0
depart_s = 160.0
dwell_s = 5.0

[train]
consist = "../steam/consists/steam.con"

[gameplay]
objective = "arrive"
difficulty = "normal"

[simulation]
duration = 240.0
time_step = 0.05
seed = 42
legacy_power_cap = false

[output]
csv = "run_steam.csv"
metadata = "run_steam.json"
