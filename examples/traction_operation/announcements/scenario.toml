[scenario]
name = "Anuncios autorizados · Diésel: arranque, parada y combustible"
description = "Prueba sintética de 1 km, sin catenaria. K acciona el motor y B abre sus controles. Paradas de 5 segundos."

[route]
path = "../route"
start = "a"
destination = "b"
assume_signals_clear = true

[[route.stops]]
node = "a"
arrive_s = 0.0
depart_s = 5.0
dwell_s = 5.0

[[route.stops]]
node = "mid"
arrive_s = 90.0
depart_s = 95.0
dwell_s = 5.0

[[route.stops]]
node = "b"
arrive_s = 160.0
depart_s = 160.0
dwell_s = 5.0

[train]
consist = "../consists/diesel.con"

[gameplay]
objective = "arrive"
difficulty = "normal"

[simulation]
duration = 240.0
time_step = 0.05
seed = 42
legacy_power_cap = false

[output]
csv = "run.csv"
metadata = "run.json"

[train.announcements]
root = "."
author = "openrailsrs contributors; voz de demostración generada con CMU Flite"
license = "GPL-3.0-only (textos y clips propios)"
source = "https://github.com/cavazquez/openrailsrs/tree/main/examples/traction_operation/announcements"
[[train.announcements.events]]
id = "arrival"
stop = 0
event = "arrival"
text = "Bienvenido a la estación laboratorio. Revisá las puertas antes de partir."
file = "audio/arrival.wav"
[[train.announcements.events]]
id = "approach"
stop = 1
event = "approach"
text = "Próxima parada: estación laboratorio. Prepará la bajada."
file = "audio/approach.wav"
[[train.announcements.events]]
id = "departure"
stop = 0
event = "departure"
text = "El tren está saliendo. Gracias por viajar con nosotros."
file = "audio/departure.wav"
