# Physics replay only. Stops and signals are represented by the frozen native driver;
# the station service contracts are checked separately by play-service.
[scenario]
name = "Chiltern local: Northolt Park → West Ruislip"
description = "Servicio local con Pullman: detenerse, abrir puertas, cumplir la parada y cerrar puertas."
start_time_s = 35700

[route]
path = "../chiltern_extended"
start = "n93"
destination = "n105"
start_offset_m = 1385.9003278212956
assume_signals_clear = true
waypoints = ["n93", "n95", "n97", "n99", "n101", "n103", "n105"]

[train]
consist = "physics/consists/birmingham_pullman.con"

[gameplay]
objective = "arrive_on_time"
difficulty = "normal"
penalty_per_second_late = 2.0

[simulation]
duration = 750.1
time_step = 0.05
seed = 0
multi_body = true
coupler_kind = "pullman"
legacy_power_cap = false
train_air_lap_hold = true
train_air_full_release_s = 3.0
brake_shoe_speed_factor = true
brake_skid_limit = true
# Live controls express EP service demand, not the old logger's PSI/121 scale.
driver_brake_full_scale_psi = 45.0
brake_cylinder_full_scale_psi = 45.0

# Reproduce the original headless capture's initial conditions.
# See physics/environment.json; this does not select player weather.
[simulation.native_physics]
ambient_c = 18.61272
adhesion_factor = 0.5
first_slippery_spot = [1136.011, 18.2413254]
paused_weather = true

[output]
csv = "run.csv"
metadata = "run.json"
